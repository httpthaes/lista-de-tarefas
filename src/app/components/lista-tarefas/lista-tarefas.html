<div>
    <ul>
        <li *ngFor="let tarefa of tarefaService.tarefas">
            <input type="checkbox" [checked]="tarefa.concluida">
            <span>{{ tarefa.descricao }}</span>
            <button (click)="removerTarefa(tarefa)"><i class="fa-regular fa-trash-can"></i></button>
        </li>
    </ul>
</div>
